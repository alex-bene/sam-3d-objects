[project]
name = "sam3d_objects"
version = "0.0.1"
# required for "hatch-requirements-txt" to work
requires-python = ">=3.11,<=3.12"
dependencies = [
    "astor==0.8.1",
    "async-timeout==4.0.3",
    "conda-pack==0.7.1",
    "cuda-python==12.1.0",
    "dataclasses==0.6",
    "easydict==1.13",
    "httplib2==0.22.0",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher==1.2.0",
    "igraph==0.11.8",
    "jupyter==1.1.1",
    "lightning>=2.3.3",
    "loguru==0.7.2",
    "nvidia-cuda-nvcc-cu12==12.1.105",
    "nvidia-pyindex==1.0.9",
    "open3d==0.18.0",
    "opencv-contrib-python-headless>=4.9.0.80",
    "optree==0.14.1",
    "pip-system-certs==4.0",
    "point-cloud-utils==0.29.5",
    "pymeshfix==0.17.0",
    "PySocks==1.7.1",
    "scikit-image==0.23.1",
    "timm==0.9.16",
    "uri-template==1.3.0",
    "xatlas==0.0.9",
    "xformers>=0.0.28.post2",
    "MoGe @ git+https://github.com/microsoft/MoGe.git",
    "plyfile>=1.1.3",
]

[project.optional-dependencies]
cpu = [
    "torch==2.8.0",
    "xformers",
    "pytorch3d==0.7.8+pt2.8.0cpu",
    "kaolin==0.18.0",
]
cu124 = [
    "torch==2.6.0",
    "xformers==0.0.29.post2",
    "pytorch3d==0.7.8+pt2.6.0cu124",
    "kaolin==0.18.0",
]
cu126 = [
    "torch==2.8.0",
    "xformers==0.0.32.post2",
    "pytorch3d==0.7.8+pt2.8.0cu126",
    "kaolin==0.18.0",
]
cu128 = [
    "torch==2.8.0",
    "xformers==0.0.32.post2",
    "pytorch3d==0.7.8+pt2.8.0cu128",
    "kaolin==0.18.0",
]
inference = [
    "gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@2323de5905d5e90e035f792fe65bad0fedd413e7",
    "seaborn>=0.13.2",
    "gradio>=5.49.0",
    "huggingface-hub[cli]",
]
nvdiffrast = ["nvdiffrast"]
diff_gaus_raster = ["diff_gaussian_rasterization"]

[dependency-groups]
dev = ["pytest", "findpydeps", "pipdeptree", "lovely_tensors"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
gsplat = ["torch"]
nvidia-pyindex = ["pip"]
nvdiffrast = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[tool.uv]
no-build-isolation-package = ["diff_gaussian_rasterization"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
kaolin = [
    { index = "kaolin-cpu", extra = "cpu" },
    { index = "kaolin-cu124", extra = "cu124" },
    { index = "kaolin-cu126", extra = "cu126" },
    { index = "kaolin-cu128", extra = "cu128" },
]
pytorch3d = { index = "pytorch3d-wheels" }
tinyvis = { git = "https://github.com/alex-bene/tinyvis.git" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git" }
diff_gaussian_rasterization = { git = "https://github.com/autonomousvision/mip-splatting.git", subdirectory = "submodules/diff-gaussian-rasterization" }

[[tool.uv.index]]
name = "kaolin-cpu"
url = "https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.8.0_cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "kaolin-cu124"
url = "https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.6.0_cu124.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "kaolin-cu126"
url = "https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.8.0_cu126.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "kaolin-cu128"
url = "https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.8.0_cu128.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch3d-wheels"
url = "https://miropsota.github.io/torch_packages_builder"
explicit = true

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build]
ignore-vcs = true
include = ["**/*.py"]
exclude = ["conftest.py", "*_test.py"]
packages = ["sam3d_objects"]

[tool.hatch.metadata]
# for git-referenced dependencies
allow-direct-references = true

[tool.hatch.envs.default.env-vars]
PIP_EXTRA_INDEX_URL = "https://pypi.ngc.nvidia.com"
